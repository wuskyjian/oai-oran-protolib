syntax = "proto2";

enum RAN_message_type{
    SUBSCRIPTION = 1;
    INDICATION_REQUEST = 2;
    INDICATION_RESPONSE = 3;
    CONTROL = 4;
} 

enum RAN_parameter{
    GNB_ID = 1;
    UE_LIST = 3;
    TIMESTAMP = 4;
}

message RAN_param_map_entry{
    required RAN_parameter key = 1;
    oneof value{
        int64 int64_value  = 2;
        string string_value = 3;
        ue_list_m ue_list = 4;
        int64 timestamp = 5;       // Timestamp in milliseconds
    }
}

/* RAN SUBMESSAGES */
message RAN_indication_request{
    repeated RAN_parameter target_params = 1;
}

message RAN_indication_response{
    repeated RAN_param_map_entry param_map = 1;
}

message RAN_control_request{
    repeated RAN_param_map_entry target_param_map = 1;
}

/* MASTER RAN MESSAGE */

message RAN_message{
    required RAN_message_type msg_type = 1;
    oneof payload{
        RAN_indication_request ran_indication_request = 2;
        RAN_indication_response ran_indication_response = 3;
        RAN_control_request ran_control_request = 4;
    }
}

message ue_info_m{

    // this is to identify the ue
    required int32 rnti=1;

    // UE measurement metrics (reported by the gNB)
    optional float rsrp=2;         // Reference Signal Received Power
    optional float bler_ul=3;      // Block Error Rate Uplink
    optional float bler_dl=4;      // Block Error Rate Downlink
    optional float mcs_ul=5;       // Modulation and Coding Scheme Uplink
    optional float mcs_dl=6;       // Modulation and Coding Scheme Downlink

    // scheduler utilisation stats (reported by gNB)
    optional uint32 dl_prbs_total = 7; // Total allocated DL PRBs over the reporting window
    optional uint32 ul_prbs_total = 8; // Total allocated UL PRBs over the reporting window

    // specific ue's propoerties (these will be set by the xapp and sent to gnb)
    optional bool prop_1 = 9;
    optional float prop_2 = 10;


}

message ue_list_m{
  required int32 connected_ues = 1;
  repeated ue_info_m ue_info = 2;
}
